<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Molecule Database</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🧪 Molecule Database</h1>
    <p>Explore information about chemical molecules</p>
  </header>

  <div class="container">

    <div class="search-box">

      <input
        type="text"
        id="search"
        placeholder="Enter molecule name"
      >

      <button onclick="searchMolecule()">
        Search
      </button>

    </div>

    <div id="results"></div>

  </div>

  <script>

    const molecules = [

      {
        name: "Oxygen",
        formula: "O₂",
        type: "Element",
        info: "Oxygen is a gas essential for respiration."
      },

      {
        name: "Hydrogen",
        formula: "H₂",
        type: "Element",
        info: "Hydrogen is the lightest element."
      },

      {
        name: "Water",
        formula: "H₂O",
        type: "Compound",
        info: "Water is essential for life."
      },

      {
        name: "Methane",
        formula: "CH₄",
        type: "Compound",
        info: "Methane is a major component of natural gas."
      },

      {
        name: "Carbon Dioxide",
        formula: "CO₂",
        type: "Compound",
        info: "Carbon dioxide is produced during respiration."
      },

      {
        name: "Nitrogen",
        formula: "N₂",
        type: "Element",
        info: "Nitrogen is the most abundant gas in Earth's atmosphere."
      }

    ];


    function searchMolecule() {

      const input =
        document.getElementById("search").value
        .trim()
        .toLowerCase();

      const results =
        document.getElementById("results");


      if (input === "") {

        results.innerHTML =
          "<p>Please enter a molecule name.</p>";

        return;
      }


      const found = molecules.filter(
        molecule =>
          molecule.name.toLowerCase().includes(input) ||
          molecule.formula.toLowerCase().includes(input)
      );


      if (found.length === 0) {

        results.innerHTML =
          "<p>No molecule found.</p>";

        return;
      }


      results.innerHTML = found.map(
        molecule => `

          <div class="molecule-card">

            <h2>${molecule.name}</h2>

            <p>
              <strong>Formula:</strong>
              ${molecule.formula}
            </p>

            <p>
              <strong>Type:</strong>
              ${molecule.type}
            </p>

            <p>${molecule.info}</p>

          </div>

        `
      ).join("");

    }

  </script>

</body>
  </html>
