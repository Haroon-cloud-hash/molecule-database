<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Molecule Database</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🧪 Molecule Database</h1>
        <p>Explore information about chemical molecules</p>
    </header>

    <main class="container">

        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="Search molecule by name or formula..."
            >

            <button onclick="searchMolecule()">
                🔍 Search
            </button>
        </div>

        <div id="results"></div>

    </main>

    <script src="molecules.js"></script>
    <script src="script.js"></script>

</body>
</html>
