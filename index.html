<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Molecule Database</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🧪 Molecule Database</h1>
        <p>Explore information about chemical molecules</p>
    </header>

    <main class="container">

        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="Search molecule by name or formula..."
            >

            <button onclick="searchMolecule()">
                🔍 Search
            </button>
        </div>

        <div id="results"></div>
<section class="reaction-section">

    <h2>⚗️ Chemical Reaction</h2>

    <p>Select two compounds to check a known reaction.</p>

    <select id="reactant1">
        <option value="">Select first compound</option>
        <option value="hydrogen">Hydrogen</option>
        <option value="oxygen">Oxygen</option>
        <option value="water">Water</option>
        <option value="sodium-hydroxide">Sodium Hydroxide</option>
        <option value="hydrochloric-acid">Hydrochloric Acid</option>
    </select>

    <select id="reactant2">
        <option value="">Select second compound</option>
        <option value="hydrogen">Hydrogen</option>
        <option value="oxygen">Oxygen</option>
        <option value="water">Water</option>
        <option value="sodium-hydroxide">Sodium Hydroxide</option>
        <option value="hydrochloric-acid">Hydrochloric Acid</option>
    </select>

    <button onclick="showReaction()">
        ⚗️ Show Reaction
    </button>

    <div id="reaction-result"></div>

</section>
    </main>

    <script src="molecules.js"></script>
    <script src="script.js"></script>

</body>
</html>
